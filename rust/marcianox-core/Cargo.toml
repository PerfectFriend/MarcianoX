[package]
name = "marcianox_core"
version = "1.0.0"
edition = "2021"
description = "Native Rust cryptographic and networking core for MarcianoX"

[lib]
name = "marcianox_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
argon2 = "0.5"
hkdf = "0.12"
aes-gcm = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
bip39 = { version = "2.1", features = ["rand"] }
sharks = "0.5"
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-socks = "0.5"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
futures-util = "0.3"
url = "2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
